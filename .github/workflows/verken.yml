name: Verkenning ticketpagina's

on:
  workflow_dispatch:   # alleen handmatig starten

permissions:
  contents: read

jobs:
  verken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser installeren
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Pagina's verkennen
        run: python scripts/verken.py
      - name: Resultaat bewaren (niet in de map, maar als download)
        uses: actions/upload-artifact@v4
        with:
          name: verkenning
          path: verkenning.json
          retention-days: 3
