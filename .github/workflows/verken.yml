name: Verkenning ticketpagina's

on:
  workflow_dispatch:
    inputs:
      lijst:
        description: "Welke lijst? scripts/verken_lijst.txt (breed) of scripts/verken_diep_lijst.txt (verdieping)"
        default: "scripts/verken_lijst.txt"

permissions:
  contents: read

jobs:
  verken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser installeren
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Pagina's verkennen
        env:
          LIJST: ${{ github.event.inputs.lijst }}
        run: python scripts/verken.py "$LIJST"
      - name: Resultaat bewaren (niet in de map, maar als download)
        uses: actions/upload-artifact@v4
        with:
          name: verkenning
          path: verkenning*.json
          retention-days: 3
