name: Dagelijkse update

on:
  schedule:
    - cron: "0 5 * * *"   # elke dag rond 05:00 UTC
  workflow_dispatch:       # maakt de knop "Run workflow" mogelijk om hem handmatig te starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser installeren
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Gegevens ophalen
        run: python scripts/update.py
      - name: Pagina's voor zoekmachines bouwen
        continue-on-error: true   # lukt dit niet, dan wordt de update zelf toch opgeslagen
        run: python scripts/bouw_site.py
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "update-bot"
          git config user.email "update-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Dagelijkse update" && git push)
